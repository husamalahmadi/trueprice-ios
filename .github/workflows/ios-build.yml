name: iOS test build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Prepare the iOS project
        run: npx cap sync ios

      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid // empty')
          if [ -z "$UDID" ]; then echo "No iPhone simulator found"; exit 1; fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Build the app
        working-directory: ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -destination "id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/dd" -quiet build

      - name: Package the app
        run: |
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/TruePrice-simulator.zip" App.app

      - name: Open the app and take a screenshot
        continue-on-error: true
        timeout-minutes: 10
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$SIM_UDID" cash.trueprice.app
          sleep 40
          xcrun simctl io "$SIM_UDID" screenshot launch.png

      - uses: actions/upload-artifact@v7
        with:
          name: ios-test-build
          path: |
            TruePrice-simulator.zip
            launch.png
          retention-days: 7
